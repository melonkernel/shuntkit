name: Release

# Publishes to PyPI via trusted publishing when a v* tag is pushed.
# One-time setup: on pypi.org, add a "pending publisher" for
# owner melonkernel, repo shuntkit, workflow release.yml, environment pypi.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --group dev
      - run: uv run pytest
      - name: Check tag matches package version
        run: |
          pkg="$(uv run python -c 'import shuntkit; print(shuntkit.__version__)')"
          tag="${GITHUB_REF_NAME#v}"
          test "$pkg" = "$tag" || { echo "tag $tag != version $pkg"; exit 1; }
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
