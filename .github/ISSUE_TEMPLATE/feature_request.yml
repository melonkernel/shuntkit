name: Feature request
description: Propose a change or addition
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that shuntkit does not do well today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
  - type: checkboxes
    id: upstream
    attributes:
      label: Upstream
      options:
        - label: I checked whether upstream shunt already does this
